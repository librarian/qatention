name: Prepare draft release
# Intentionally manual only: tags and pushes must never publish a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z or vX.Y.Z-preview.N)'
        required: true
        type: string
      commit:
        description: 'Full SHA of a main commit with successful builds and quality checks'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require successful builds and analysis at the exact commit
        id: source
        run: python scripts/prepare_release.py prepare
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.desktop }}
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.macos }}
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.android }}
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Verify original artifact digests and write checksums
        run: python scripts/prepare_release.py verify
      - name: Create draft for review
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$RELEASE_SHA" --title "$RELEASE_TAG" \
            --draft --generate-notes "${args[@]}"
