name: Prepare draft release
# Intentionally manual only: tags and pushes must never publish a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z or vX.Y.Z-preview.N)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Commit shared release version
        id: version
        run: python scripts/release_version.py bump
      - name: Build and test the version commit
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: python scripts/release_version.py build
      - name: Require successful builds and analysis at the exact commit
        id: source
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: python scripts/prepare_release.py prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.desktop }}
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.macos }}
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.android }}
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Verify original artifact digests and write checksums
        run: python scripts/prepare_release.py verify
      - name: Create draft for review
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --target "$RELEASE_SHA" --title "$RELEASE_TAG" \
            --draft --generate-notes "${args[@]}"
