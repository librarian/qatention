name: Code quality
run-name: ${{ inputs.release_sha && format('Release {0} ({1})', inputs.release_sha, inputs.release_id) || '' }}
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Release preparation only: exact main commit to build'
        type: string
      release_id:
        description: 'Release preparation only: correlation ID'
        type: string
permissions:
  contents: read
concurrency:
  group: quality-${{ inputs.release_id || github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Validate release source
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 scripts/release_version.py check-source
      - run: python -m pip install -r tools/requirements.txt
      - run: python scripts/check_cpp.py
      - name: Check workflow syntax
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=
      - name: Test release validation
        run: python -m unittest discover -s tests -p 'test_release.py'
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Validate release source
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 scripts/release_version.py check-source
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libxcb-cursor0
          python -m pip install -r tools/requirements.txt
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build desktop and mobile UI for analysis
        run: |
          cmake -S . -B build-quality -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-quality --parallel 3
          cmake -S . -B build-quality-mobile -G Ninja -DQATENTION_MOBILE=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-quality-mobile --parallel 3
      - name: Clang-tidy
        run: |
          python scripts/check_cpp.py --build build-quality
          python scripts/check_cpp.py --build build-quality-mobile
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() }}

  script-security:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Validate release source
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 scripts/release_version.py check-source
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
        mobile: ['OFF', 'ON']
        exclude:
          - sanitizer: thread
            mobile: 'ON'
    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Validate release source
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 scripts/release_version.py check-source
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev ninja-build libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libxcb-cursor0
          # Clang 18's shadow-memory layout requires this on high-entropy hosts.
          # This changes only the disposable CI runner, not installed applications.
          sudo sysctl vm.mmap_rnd_bits=28
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
      - name: Build instrumented application and tests
        run: |
          cmake -S . -B build-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DQATENTION_SANITIZER=${{ matrix.sanitizer }} -DQATENTION_MOBILE=${{ matrix.mobile }}
          cmake --build build-sanitized --parallel 3
      - name: Run sanitizer regressions
        run: |
          if [ "${{ matrix.sanitizer }}" = thread ]; then
            # Prebuilt Qt/glib omit synchronization instrumentation. Exercise
            # independent native decoders and the production Qt adapter.
            ctest --test-dir build-sanitized --output-on-failure -R '^(native_decoder|decoder_concurrency)$'
          else
            ctest --test-dir build-sanitized --output-on-failure
          fi

  memory-sanitizer:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      MSAN_OPTIONS: halt_on_error=1:print_stats=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Validate release source
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 scripts/release_version.py check-source
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev ninja-build
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Build fully instrumented native decoder tests
        run: |
          # Prebuilt Qt is not MSan-instrumented; do not claim coverage for it.
          cmake -S . -B build-msan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DQATENTION_NATIVE_TESTS_ONLY=ON -DQATENTION_SANITIZER=memory
          cmake --build build-msan --parallel 3
          ctest --test-dir build-msan --output-on-failure
