name: macOS cross-builds
run-name: ${{ inputs.release_sha && format('Release {0} ({1})', inputs.release_sha, inputs.release_id) || '' }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Release preparation only: exact main commit to build'
        type: string
      release_id:
        description: 'Release preparation only: correlation ID'
        type: string

permissions:
  contents: read

concurrency:
  group: macos-cross-${{ inputs.release_id || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Validate release source
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: python3 scripts/release_version.py check-source
      - name: Cross-build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang-18 llvm-18 lld-18 make patch xz-utils bzip2 cpio libgl1-mesa-dev libxkbcommon-dev
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
      - name: Cache macOS toolchain and Qt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: mac-cache
        with:
          path: |
            osxcross
            qt-macos
          key: ubuntu24-osxcross27d21e4-sdk14.5-qt6.8.3-rcodesign0.29-v1
      - name: Prepare cross-toolchain and macOS Qt
        if: steps.mac-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/setup_macos_cross.sh "$PWD/osxcross" "$RUNNER_TEMP/macos-build"
          python -m pip install -r tools/requirements-build.txt
          python -m aqt install-qt mac desktop 6.8.3 clang_64 -O qt-macos --archives qtbase qtsvg
      - name: Save prepared SDK cache
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            osxcross
            qt-macos
          key: ubuntu24-osxcross27d21e4-sdk14.5-qt6.8.3-rcodesign0.29-v1
      - name: Cache macOS OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: openssl-cache
        with:
          path: openssl-macos
          key: macos-sdk14.5-openssl3.5.9-${{ matrix.arch }}-v1
      - name: Cross-build OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$PWD/osxcross/bin:$PATH"
          bash scripts/build_macos_openssl.sh "$PWD/openssl-macos" "$RUNNER_TEMP/openssl-build" '${{ matrix.arch }}'
      - name: Configure
        run: |
          export PATH="$PWD/osxcross/bin:$PATH"
          ${{ matrix.arch }}-apple-darwin23.5-cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            "-DCMAKE_PREFIX_PATH=$PWD/qt-macos/6.8.3/macos" \
            "-DCMAKE_FIND_ROOT_PATH=$PWD/qt-macos/6.8.3/macos" \
            "-DQT_HOST_PATH=$QT_ROOT_DIR"
      - name: Build and install
        run: |
          export PATH="$PWD/osxcross/bin:$PATH"
          cmake --build build --parallel 3
          cmake --install build --prefix "$PWD/dist"
      - name: Test signature hash validation
        run: python tests/test_macos_signature.py
      - name: Bundle, sign and verify dependencies
        run: |
          export PATH="$PWD/osxcross/bin:$PATH"
          python scripts/package_macos.py --qt qt-macos/6.8.3/macos --openssl openssl-macos --dest dist --tools osxcross/bin --arch ${{ matrix.arch }}
      - name: Include Qt licenses
        run: |
          mkdir -p dist/licenses/qt
          for name in LGPL-3.0-only GPL-3.0-only; do
            curl --fail --location "https://raw.githubusercontent.com/qt/qtbase/v6.8.3/LICENSES/$name.txt" -o "dist/licenses/qt/$name.txt"
          done
      - name: Create ZIP
        run: python scripts/archive.py dist qatention-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: qatention-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
