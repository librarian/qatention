name: Android preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"'
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
      - name: Test mobile interface on Linux
        run: |
          cmake -S . -B build-mobile -G Ninja -DQATENTION_MOBILE=ON
          cmake --build build-mobile --parallel 3
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software build-mobile/qatention --smoke-test
          ctest --test-dir build-mobile --output-on-failure
      - name: Cache Android Qt and OpenSSL
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            qt-android
            openssl-android
          key: android-arm64-qt6.8.3-ndk26.1-openssl3.5.9-v2
      - name: Prepare Android libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install -r tools/requirements-build.txt
          python -m aqt install-qt linux android 6.8.3 android_arm64_v8a -O qt-android
          bash scripts/build_android_openssl.sh openssl-android openssl-work "$ANDROID_HOME/ndk/26.1.10909125"
      - name: Save prepared Android libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            qt-android
            openssl-android
          key: android-arm64-qt6.8.3-ndk26.1-openssl3.5.9-v2
      - name: Include Qt licenses
        run: |
          for name in LGPL-3.0-only GPL-3.0-only; do
            curl --fail --location "https://raw.githubusercontent.com/qt/qtbase/v6.8.3/LICENSES/$name.txt" -o "openssl-android/$name.txt"
          done
      - name: Build APK
        run: |
          qt-android/6.8.3/android_arm64_v8a/bin/qt-cmake -S . -B build-android -G Ninja \
            -DQT_HOST_PATH="$QT_ROOT_DIR" -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125" \
            -DANDROID_OPENSSL_DIR="$PWD/openssl-android" -DCMAKE_BUILD_TYPE=Debug \
            -DQATENTION_ANDROID_VERSION_CODE="$((100 + GITHUB_RUN_NUMBER))"
          cmake --build build-android --target apk --parallel 3
      - name: Verify and stage APK
        run: |
          mkdir -p dist-android
          apk=build-android/android-build/build/outputs/apk/debug/android-build-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          python3 scripts/verify_android_elf.py "$apk"
          unzip -l "$apk" | grep 'lib/arm64-v8a/libssl_3.so'
          unzip -l "$apk" | grep 'lib/arm64-v8a/libcrypto_3.so'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep 'android.permission.INTERNET'
          cp "$apk" dist-android/qatention-android-arm64-preview.apk
      - name: Sign main builds with persistent identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.ANDROID_SIGNING_CERT }}
        run: |
          set -eu
          test -n "$SIGNING_KEY" && test -n "$SIGNING_CERT"
          umask 077
          signing_dir=$(mktemp -d)
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$signing_dir/key.pk8"
          printf '%s' "$SIGNING_CERT" | base64 --decode > "$signing_dir/cert.pem"
          apk=dist-android/qatention-android-arm64-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --key "$signing_dir/key.pk8" --cert "$signing_dir/cert.pem" "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          expected=$(openssl x509 -in "$signing_dir/cert.pem" -outform DER | sha256sum | cut -d ' ' -f1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -F "certificate SHA-256 digest: $expected"
          rm -f "$apk.idsig"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist-android/qatention-android-arm64-preview.apk
          archive: false
